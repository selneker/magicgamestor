name: Backend CI

# Automated backend verification for Magic Game Store.
#
# Purpose: future PRs can no longer rely exclusively on manually reported test
# results. Every PR to `main` (and every push to `main`) runs the deterministic
# backend suites on a DISPOSABLE MongoDB with DUMMY credentials and MOCKED
# supplier calls. No production service, production database or real payment is
# ever contacted.
#
# Tiers (see .github/ci/backend-ci-notes.md for the full rationale):
#   unit-tests        -> mocked supplier (httpx MockTransport) + local MongoDB, NO live backend
#   integration-tests -> local uvicorn backend + local MongoDB, deterministic multi-game regression
#
# Tests that require REAL external credentials (live FazerCards key, real admin
# credentials, external preview URLs) are intentionally EXCLUDED from both jobs
# and remain manual-only. They are never reported as passing here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1 - unit tests: supplier HTTP is mocked, only a local MongoDB is needed.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dummy, non-production values only. No repository secret is referenced.
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: magicgamestore_ci
      JWT_SECRET: ci-dummy-jwt-secret-not-real
      ADMIN_EMAIL: admin@magicgame.store
      ADMIN_PASSWORD: CiDummy12345!
      PAYMENT_MODE: simulation
      FAZERCARDS_API_BASE: http://127.0.0.1:9/api/v2
      FAZERCARDS_API_KEY: fc_dummy_ci_key
      FAZERCARDS_WEBHOOK_SECRET: whsec_ci_dummy
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install reproducible backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip freeze > /tmp/pip-freeze-unit.txt

      - name: Write dummy test environment (overwrites tracked .env; no real secrets)
        working-directory: backend
        run: |
          cat > .env <<'ENVEOF'
          MONGO_URL=mongodb://localhost:27017
          DB_NAME=magicgamestore_ci
          JWT_SECRET=ci-dummy-jwt-secret-not-real
          ADMIN_EMAIL=admin@magicgame.store
          ADMIN_PASSWORD=CiDummy12345!
          PAYMENT_MODE=simulation
          FAZERCARDS_API_BASE=http://127.0.0.1:9/api/v2
          FAZERCARDS_API_KEY=fc_dummy_ci_key
          FAZERCARDS_WEBHOOK_SECRET=whsec_ci_dummy
          FRONTEND_URL=http://localhost:3000
          CORS_ORIGINS=http://localhost:3000
          ENVEOF

      - name: Guard - no real secrets in the test environment
        working-directory: backend
        run: |
          if grep -Eq 'mongodb\+srv://|-----BEGIN|AKIA[0-9A-Z]{16}' .env; then
            echo "::error::A real-looking secret was found in backend/.env"; exit 1
          fi
          echo "OK: dummy test environment only."

      - name: Run unit tier (mocked supplier, no live backend)
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest \
            tests/test_binance_configured.py \
            tests/test_fazercards_catalog.py \
            tests/test_fazercards_validate.py \
            tests/test_fzr_phase3.py \
            tests/test_fzr_composite_fulfillment.py \
            tests/test_fzr_multiline.py \
            tests/test_fzr_uc_audit.py \
            tests/test_mailjet.py \
            tests/test_payment_fees.py \
            tests/test_phase2_provider.py \
            -k "not TestLive" \
            --deselect tests/test_fzr_phase3.py::TestWebhook::test_live_endpoint_rejects_unsigned \
            --deselect tests/test_fzr_phase3.py::TestWebhook::test_webhook_event_completes_order \
            --deselect tests/test_fzr_phase3.py::TestStatusSync::test_refresh_status_completed_delivers_mgs_order \
            --deselect tests/test_fzr_phase3.py::TestFulfillPreconditions::test_multi_item_order_not_eligible \
            --deselect tests/test_fzr_multiline.py::TestMultiLineFulfill::test_qty_gt1_line_skipped_others_sent \
            -p no:cacheprovider -q 2>&1 | tee /tmp/pytest-unit.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: |
            /tmp/pytest-unit.log
            /tmp/pip-freeze-unit.txt
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Tier 2 - integration tests: local uvicorn backend + local MongoDB.
  # Still no external service: the supplier base URL points at an unreachable
  # local port, so any accidental real call fails fast instead of hitting prod.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: magicgamestore_ci
      JWT_SECRET: ci-dummy-jwt-secret-not-real
      ADMIN_EMAIL: admin@magicgame.store
      ADMIN_PASSWORD: CiDummy12345!
      PAYMENT_MODE: simulation
      FAZERCARDS_API_BASE: http://127.0.0.1:9/api/v2
      FAZERCARDS_API_KEY: fc_dummy_ci_key
      FAZERCARDS_WEBHOOK_SECRET: whsec_ci_dummy
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      BACKEND_TEST_URL: http://127.0.0.1:8001
      TEST_API_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install reproducible backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip freeze > /tmp/pip-freeze-integration.txt

      - name: Write dummy test environment (overwrites tracked .env; no real secrets)
        working-directory: backend
        run: |
          cat > .env <<'ENVEOF'
          MONGO_URL=mongodb://localhost:27017
          DB_NAME=magicgamestore_ci
          JWT_SECRET=ci-dummy-jwt-secret-not-real
          ADMIN_EMAIL=admin@magicgame.store
          ADMIN_PASSWORD=CiDummy12345!
          PAYMENT_MODE=simulation
          FAZERCARDS_API_BASE=http://127.0.0.1:9/api/v2
          FAZERCARDS_API_KEY=fc_dummy_ci_key
          FAZERCARDS_WEBHOOK_SECRET=whsec_ci_dummy
          FRONTEND_URL=http://localhost:3000
          CORS_ORIGINS=http://localhost:3000
          ENVEOF

      - name: Guard - no real secrets in the test environment
        working-directory: backend
        run: |
          if grep -Eq 'mongodb\+srv://|-----BEGIN|AKIA[0-9A-Z]{16}' .env; then
            echo "::error::A real-looking secret was found in backend/.env"; exit 1
          fi
          echo "OK: dummy test environment only."

      - name: Start disposable backend (dummy creds, unreachable supplier)
        working-directory: backend
        run: |
          set -a; . ./.env; set +a
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/health >/dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend failed to start"; tail -50 /tmp/backend.log; exit 1

      - name: Run integration tier (deterministic multi-game regression)
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest \
            tests/test_multigame_core.py \
            tests/test_saved_identities.py \
            tests/test_phase3_games.py \
            tests/test_phase3_game_isolation.py \
            -p no:cacheprovider -q 2>&1 | tee /tmp/pytest-integration.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            /tmp/pytest-integration.log
            /tmp/backend.log
            /tmp/pip-freeze-integration.txt
          if-no-files-found: ignore
          retention-days: 7
