name: Force sync app into magicgamestor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout magicgamestor
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Clone public app repository
        run: |
          rm -rf /tmp/app
          git clone --depth 1 --branch main \
            https://github.com/selneker/app.git \
            /tmp/app

      - name: Replace project with app
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='backend/.env' \
            --exclude='frontend/.env' \
            /tmp/app/ ./

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Force sync app into magicgamestor"
          git push origin HEAD:main
