        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#F4F3EE" />
        <script>
            (function () {
                var theme;
                try { theme = localStorage.getItem('mgs-theme'); } catch (_) {}
                var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
                document.querySelector('meta[name="theme-color"]').content = dark ? '#2B2B2B' : '#F4F3EE';
            })();
        </script>
        <style>html,body{background:#F4F3EE;color:#0A0A0A}html.dark,html.dark body{background:#2B2B2B;color:#F4F3EE}</style>
        <meta name="description" content="Recharges de jeux mobiles à Madagascar : UC PUBG Mobile, abonnements et packs. Paiement MVola, Orange Money ou USDT, compte joueur vérifié avant paiement." />

        <title>Magic Game Store — Recharges de jeux à Madagascar</title>
        <!-- Loader de démarrage (PL-BRAND-1) : peint dès le parse HTML, avant le bundle.
             Formes/durées = prototype validé (loader-prototype.html), intégration seule.
             Couleurs inline : le CSS de l'app (et ses jetons) n'est pas encore chargé ici. -->
        <style>
            #mgs-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#E9E2D8;
              transition:opacity .5s ease,visibility .5s}
            #mgs-loader.is-done{opacity:0;visibility:hidden}
            .mgs-logo{width:min(34vmin,180px);height:auto;overflow:visible}
            .mgs-disc{fill:#000;transform-origin:415px 415px;animation:mgs-disc-in .55s cubic-bezier(.2,.9,.3,1) both}
            .mgs-star{fill:#CBFE01;transform-origin:415px 415px;animation:mgs-star-in .6s cubic-bezier(.2,1.2,.3,1) .35s both,
              mgs-pulse 1.6s ease-in-out 1.1s infinite}
            .mgs-bar{position:absolute;bottom:18vh;width:90px;height:3px;background:rgba(0,0,0,.12);border-radius:3px;overflow:hidden}
            .mgs-bar::after{content:"";display:block;height:100%;width:40%;background:#000;border-radius:3px;animation:mgs-slide 1.1s ease-in-out infinite}
            .mgs-wake{position:absolute;bottom:calc(18vh - 28px);font:500 13px/1.4 system-ui,sans-serif;color:#0A0A0A}
            @keyframes mgs-disc-in{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
            @keyframes mgs-star-in{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
            @keyframes mgs-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
            @keyframes mgs-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
            @media (prefers-reduced-motion:reduce){.mgs-disc,.mgs-star,.mgs-bar::after{animation:none}.mgs-star{transform:none}}
        </style>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <!-- Loader : une seule fois par session (sessionStorage), disparu quand React a rendu
             (window.__mgsLoaderReady, appelé par App.js) — 900 ms minimum, 8 s maximum. -->
        <div id="mgs-loader" role="status" aria-live="polite" aria-busy="true" aria-label="Chargement">
          <svg class="mgs-logo" viewBox="0 0 830 830" aria-hidden="true">
            <circle class="mgs-disc" cx="415" cy="415" r="415"/>
            <path class="mgs-star" d="M415 0A415 415 0 0 0 830 415A415 415 0 0 0 415 830A415 415 0 0 0 0 415A415 415 0 0 0 415 0Z"/>
          </svg>
          <div class="mgs-bar"></div>
          <p class="mgs-wake" id="mgs-loader-wake" hidden></p>
        </div>
        <script>
            (function () {
                var loader = document.getElementById('mgs-loader');
                try {
                    if (sessionStorage.getItem('mgs-loader-seen')) { loader.remove(); return; }
                    sessionStorage.setItem('mgs-loader-seen', '1');
                } catch (_) {}
                var start = Date.now();
                var finished = false;
                var wake = document.getElementById('mgs-loader-wake');
                // Le système de traduction de l'app vit dans le bundle (pas encore chargé) :
                // langue lue dans localStorage, français par défaut (langue du site).
                var wakeText = { fr: 'Réveil du serveur…', en: 'Waking the server…' };
                var lang = 'fr';
                try { lang = localStorage.getItem('mgs_lang') === 'en' ? 'en' : 'fr'; } catch (_) {}
                if (wake) wake.textContent = wakeText[lang] || wakeText.fr;
                function finish() {
                    if (finished || !loader.parentNode) return;
                    finished = true;
                    var wait = Math.max(0, 900 - (Date.now() - start));
                    setTimeout(function () {
                        loader.classList.add('is-done');
                        loader.removeAttribute('aria-busy');
                        setTimeout(function () { loader.remove(); }, 550);
                    }, wait);
                }
                window.__mgsLoaderReady = finish;
                setTimeout(finish, 8000); // plafond : l'overlay disparaît quoi qu'il arrive
                setTimeout(function () { if (!finished && wake) wake.hidden = false; }, 4000);
            })();
        </script>
        <noscript><style>#mgs-loader{display:none}</style>You need to enable JavaScript to run this app.</noscript>
